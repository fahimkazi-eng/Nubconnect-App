<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NUBCONNECT">
  <!-- CAMPUS ORBIT brand mark: violet→aqua rounded square, white N monogram -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#927CFA" />
      <stop offset="1" stop-color="#72DCCB" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <g fill="#FFFFFF">
    <!-- N monogram: two vertical stems + diagonal -->
    <rect x="136" y="136" width="52" height="240" rx="16" />
    <rect x="324" y="136" width="52" height="240" rx="16" />
    <polygon points="188,136 376,336 376,376 188,176" />
    <polygon points="188,336 188,376 376,176 376,136" />
  </g>
</svg>
